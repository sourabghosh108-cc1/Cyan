<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hind.com — Bharat's Search Engine</title>
  <!-- Instant redirect to the main Hind.com app -->
  <meta http-equiv="refresh" content="0; url=Hind-main/index.html">
  <link rel="canonical" href="Hind-main/index.html">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 1rem;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(6, 182, 212, 0.2);
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #94a3b8; font-size: 0.95rem; }
    a { color: #06b6d4; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Loading Hind.com… <a href="Hind-main/index.html">Click here if not redirected</a></p>
  <script>
    // Instant JS redirect as backup
    window.location.replace('Hind-main/index.html');
  </script>
</body>
</html>
