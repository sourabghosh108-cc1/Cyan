<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Hind.com — Redirecting</title>
  <!-- Instant redirect to About page -->
  <meta http-equiv="refresh" content="0; url=https://about-ruddy-alpha.vercel.app/">
  <link rel="canonical" href="https://about-ruddy-alpha.vercel.app/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 1.25rem;
      text-align: center;
      padding: 1.5rem;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(6, 182, 212, 0.2);
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; font-weight: 600; color: #f1f5f9; }
    p { color: #94a3b8; font-size: 0.95rem; }
    a { color: #06b6d4; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Redirecting to About Hind.com…</h1>
  <p><a href="https://about-ruddy-alpha.vercel.app/">Click here if you are not redirected automatically</a></p>
  <script>
    // Instant JS redirect
    window.location.replace('https://about-ruddy-alpha.vercel.app/');
  </script>
</body>
</html>
